name: Anchor Protocol
description: 'Anchor Protocol is a Terra-based decentralized finance (DeFi) savings
  protocol that offered a low-volatility yield on Terra stablecoin (UST) deposits,
  borrowing against bonded-asset (bAsset) collateral such as bLUNA and bETH, and
  cross-chain access through EthAnchor and xAnchor. Its developer surface is a set
  of first-party JavaScript/TypeScript SDKs (Anchor.js and Anchor Earn) plus on-chain
  CosmWasm smart contracts rather than a REST or OpenAPI web API. The project is part
  of the Terra ecosystem and is backed by Pantera Capital; its main web application
  deployment is currently disabled, though its developer documentation and npm SDK
  packages remain published.'
